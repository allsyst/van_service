<VirtualHost *:80>
    ServerName _default_
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/vanservice-error.log
    CustomLog ${APACHE_LOG_DIR}/vanservice-access.log combined
</VirtualHost>
